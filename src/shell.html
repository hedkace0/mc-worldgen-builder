<title>Density Function Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Chakra+Petch:wght@600&display=swap">
<style>
/* Layout: full-height workbench. Node canvas on the left, live terrain preview on the right; stacks on phones. */
:root {
  --bg: #e9ebef;
  --panel: #f6f7f9;
  --panel-2: #ffffff;
  --line: #cfd3db;
  --line-strong: #aeb4c0;
  --fg: #1c2028;
  --fg-dim: #5b6372;
  --accent: #7a4fd0;          /* amethyst */
  --accent-fg: #ffffff;
  --grid: rgba(40, 50, 70, 0.07);
  --grid-major: rgba(40, 50, 70, 0.13);
  --wire: #6f7787;
  --wire-active: var(--accent);
  --node-bg: #ffffff;
  --node-shadow: 0 1px 2px rgba(20, 24, 33, 0.12), 0 4px 14px rgba(20, 24, 33, 0.08);
  --danger: #c43c3c;
  --ok: #2f8a4c;
  --c-input: #3d8f5a;
  --c-noise: #2a8b94;
  --c-math: #4a6fd1;
  --c-shape: #b5782a;
  --c-select: #b04a8a;
  --c-util: #6b7385;
  --c-out: #c0612b;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-display: "Chakra Petch", "IBM Plex Sans", system-ui, sans-serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171c; --panel: #1c1f26; --panel-2: #23272f; --line: #2e333d; --line-strong: #444b58;
    --fg: #e3e6ec; --fg-dim: #9099a8; --accent: #a983f2; --accent-fg: #15171c;
    --grid: rgba(200, 210, 230, 0.045); --grid-major: rgba(200, 210, 230, 0.09);
    --wire: #7c8596; --node-bg: #23272f; --node-shadow: 0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
    --danger: #ef6b6b; --ok: #5cc27e;
    --c-input: #4fae70; --c-noise: #3fb0b8; --c-math: #6b8cf0; --c-shape: #d79a45; --c-select: #d06aa9; --c-util: #8a93a6; --c-out: #e07a40;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171c; --panel: #1c1f26; --panel-2: #23272f; --line: #2e333d; --line-strong: #444b58;
  --fg: #e3e6ec; --fg-dim: #9099a8; --accent: #a983f2; --accent-fg: #15171c;
  --grid: rgba(200, 210, 230, 0.045); --grid-major: rgba(200, 210, 230, 0.09);
  --wire: #7c8596; --node-bg: #23272f; --node-shadow: 0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
  --danger: #ef6b6b; --ok: #5cc27e;
  --c-input: #4fae70; --c-noise: #3fb0b8; --c-math: #6b8cf0; --c-shape: #d79a45; --c-select: #d06aa9; --c-util: #8a93a6; --c-out: #e07a40;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 13px;
  overflow: hidden;
}
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

#app { height: 100%; display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); }
.main, .preview, .json-pane, .pv-status { min-width: 0; }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { display: flex; align-items: center; gap: 9px; margin-right: 6px; }
.brand-mark { width: 22px; height: 22px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; }
.brand-mark i { display: block; border-radius: 1px; }
.brand h1 { font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: 0.02em; margin: 0; white-space: nowrap; }
.brand .ver { font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim); border: 1px solid var(--line); padding: 1px 6px; border-radius: 99px; white-space: nowrap; }
.spacer { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px;
  border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--r); cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--line-strong); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 500; }
.btn.icon { width: 30px; padding: 0; justify-content: center; }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.group { display: inline-flex; }
.group .btn { border-radius: 0; margin-left: -1px; }
.group .btn:first-child { border-radius: var(--r) 0 0 var(--r); margin-left: 0; }
.group .btn:last-child { border-radius: 0 var(--r) var(--r) 0; }
.group .btn.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); position: relative; z-index: 1; }

/* ---------- main split ---------- */
.main { display: flex; min-height: 0; }
.editor {
  position: relative; flex: 1; min-width: 0; overflow: hidden; background-color: var(--bg); touch-action: none; cursor: default;
  background-image:
    linear-gradient(var(--grid-major) 1px, transparent 1px), linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
}
.row .bad { border-color: var(--danger) !important; color: var(--danger); }
.editor.panning { cursor: grabbing; }
.split { width: 6px; flex: none; cursor: col-resize; background: var(--line); position: relative; }
.split:hover, .split.drag { background: var(--accent); }
.preview { width: var(--preview-w, 44%); min-width: 300px; flex: none; display: flex; flex-direction: column; background: var(--panel); min-height: 0; }

@media (max-width: 860px) {
  body { overflow: auto; }
  #app { height: auto; min-height: 100%; }
  .main { flex-direction: column; }
  .editor { height: 58vh; flex: none; }
  .split { display: none; }
  .preview { width: 100%; min-width: 0; }
  .preview .stage { height: 62vh; flex: none; }
}

/* ---------- node editor ---------- */
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.wires { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.wires path { fill: none; stroke: var(--wire); stroke-width: 2; }
.wires path.spline-wire { stroke-dasharray: 5 4; }
.wires path.temp { stroke: var(--wire-active); stroke-dasharray: 6 4; }
.wires path.hl { stroke: var(--wire-active); stroke-width: 2.5; }

.node {
  position: absolute; min-width: 176px; background: var(--node-bg); border: 1px solid var(--line);
  border-radius: 8px; box-shadow: var(--node-shadow); user-select: none;
}
.node.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--node-shadow); }
.node.err { border-color: var(--danger); }
.node-head {
  display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 10px; cursor: grab;
  border-bottom: 1px solid var(--line); border-radius: 8px 8px 0 0; position: relative;
}
.node-head::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 8px 0 0 0; background: var(--cat); }
.node-title { font-weight: 600; font-size: 12.5px; flex: 1; white-space: nowrap; }
.node-type { font-family: var(--font-mono); font-size: 10px; color: var(--fg-dim); }
.node-btn { width: 20px; height: 20px; border: 0; background: transparent; color: var(--fg-dim); border-radius: 4px; cursor: pointer; display: grid; place-items: center; padding: 0; }
.node-btn:hover { background: var(--panel); color: var(--fg); }
.node-btn.on { color: var(--accent); }
.node-btn svg { width: 14px; height: 14px; }
.node-body { padding: 6px 0 8px; display: flex; flex-direction: column; gap: 3px; }
.row { display: flex; align-items: center; gap: 6px; padding: 0 10px; min-height: 24px; position: relative; }
.row label, .row .lbl { color: var(--fg-dim); font-size: 12px; white-space: nowrap; flex: 1; }
.row input[type="number"], .row input[type="text"], .row select {
  width: 84px; height: 22px; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--panel); font-family: var(--font-mono); font-size: 11.5px;
}
.row input.wide, .row select.wide { width: 170px; }
.row input[type="number"]::-webkit-inner-spin-button { opacity: 0.4; }
.row .vec { display: flex; gap: 3px; }
.row .vec input { width: 46px; }
.port {
  position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--node-bg);
  border: 2px solid var(--wire); cursor: crosshair; z-index: 2;
}
.port.in { left: -7px; top: 50%; margin-top: -6px; }
.port.out { right: -7px; top: 50%; margin-top: -6px; }
.port.connected { background: var(--wire); }
.port.spline { border-radius: 2px; transform: rotate(45deg); }
.port:hover, .port.target { border-color: var(--accent); background: var(--accent); }
.row.in-row .linked { font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim); }
.row .mini { height: 20px; padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); cursor: pointer; font-size: 11px; color: var(--fg-dim); }
.row .mini:hover { color: var(--fg); border-color: var(--line-strong); }
.pt-row { gap: 4px; }
.pt-row input[type="number"] { width: 54px; }
.pt-head { display: flex; gap: 4px; padding: 0 10px 0 30px; font-size: 10px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.06em; }
.pt-head span { width: 54px; }
.pt-idx { width: 16px; font-family: var(--font-mono); font-size: 10px; color: var(--fg-dim); }
.spline-plot { display: block; margin: 4px 10px 2px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
.hint { font-size: 11px; color: var(--fg-dim); padding: 0 10px; }

.editor-hud { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; align-items: center; z-index: 5; }
.hud-chip { font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim); background: var(--panel); border: 1px solid var(--line); padding: 4px 8px; border-radius: 99px; }
.editor-tip { position: absolute; right: 12px; bottom: 12px; font-size: 11.5px; color: var(--fg-dim); z-index: 5; text-align: right; line-height: 1.5; pointer-events: none; }
.editor-tip kbd { font-family: var(--font-mono); font-size: 10.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; background: var(--panel); }
.editor { container-type: size; }
@container (max-width: 980px) { .editor-tip { display: none; } }
.marquee { position: absolute; border: 1px dashed var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); pointer-events: none; z-index: 4; }

/* ---------- add-node menu ---------- */
.menu {
  position: fixed; z-index: 50; width: 300px; max-height: min(420px, 70vh); display: flex; flex-direction: column;
  background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
}
.menu input { margin: 8px; height: 30px; padding: 0 9px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); }
.menu-list { overflow: auto; padding-bottom: 6px; }
.menu-cat { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--fg-dim); padding: 8px 12px 3px; display: flex; align-items: center; gap: 6px; }
.menu-cat i { width: 8px; height: 8px; border-radius: 2px; background: var(--cat); }
.menu-item { padding: 5px 12px 5px 26px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.menu-item span { white-space: nowrap; }
.menu-item small { font-family: var(--font-mono); color: var(--fg-dim); font-size: 10.5px; }
.menu-item.act { background: var(--accent); color: var(--accent-fg); }
.menu-item.act small { color: inherit; opacity: 0.8; }

.dropdown { position: fixed; z-index: 50; width: 320px; max-height: 70vh; overflow: auto; background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.25); padding-bottom: 6px; }
.dropdown .menu-item { padding-left: 14px; }

/* ---------- preview ---------- */
.pv-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.pv-controls { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); align-items: center; }
.ctl { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--fg-dim); }
.ctl input, .ctl select { height: 26px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel-2); padding: 0 6px; font-family: var(--font-mono); font-size: 12px; color: var(--fg); }
.ctl input[type="number"] { width: 70px; }
.ctl input.seed { width: 120px; }
.ctl input[type="checkbox"] { height: auto; accent-color: var(--accent); }
.stage { position: relative; flex: 1; min-height: 240px; overflow: hidden; background: var(--bg); touch-action: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage .overlay { pointer-events: none; }
.readout { position: absolute; left: 48px; top: 10px; font-family: var(--font-mono); font-size: 11.5px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); padding: 4px 8px; border-radius: 5px; pointer-events: none; z-index: 3; white-space: pre; }
.progress { position: absolute; left: 0; top: 0; height: 2px; background: var(--accent); width: 0; transition: width .1s; z-index: 4; }
.legend { position: absolute; right: 10px; top: 10px; display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); padding: 4px 8px; border-radius: 5px; z-index: 3; pointer-events: none; }
.legend canvas { position: static; width: 90px; height: 8px; border-radius: 2px; }
.pv-status { display: flex; gap: 12px; align-items: center; padding: 6px 12px; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-dim); flex-wrap: wrap; min-height: 31px; }
.pv-status .err { color: var(--danger); font-family: var(--font-ui); }
.pv-status .target { color: var(--fg); font-family: var(--font-ui); }
.pv-status .target button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0 0 0 4px; text-decoration: underline; }
.json-pane { border-top: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.json-pane summary { list-style: none; cursor: pointer; padding: 7px 12px; display: flex; align-items: center; gap: 8px; font-weight: 500; }
.json-pane summary::-webkit-details-marker { display: none; }
.json-pane summary .chev { transition: transform .15s; display: inline-block; color: var(--fg-dim); }
.json-pane[open] summary .chev { transform: rotate(90deg); }
.json-pane pre { margin: 0; padding: 8px 12px 12px; height: 220px; overflow: auto; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.45; background: var(--panel-2); border-top: 1px solid var(--line); }
.json-pane .k { color: var(--c-math); } .json-pane .s { color: var(--c-input); } .json-pane .n { color: var(--c-shape); }

/* ---------- modal ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(10, 12, 16, 0.45); z-index: 60; display: grid; place-items: center; padding: 16px; }
.modal { width: min(640px, 100%); background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.35); display: flex; flex-direction: column; max-height: 90vh; }
.modal h2 { font-family: var(--font-display); font-size: 16px; margin: 0; padding: 14px 16px 4px; }
.modal p { margin: 0; padding: 0 16px 10px; color: var(--fg-dim); }
.modal textarea { margin: 0 16px; min-height: 260px; resize: vertical; padding: 10px; font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px 14px; align-items: center; }
.modal .actions .msg { flex: 1; color: var(--danger); font-size: 12px; }
.noise-grid { display: grid; grid-template-columns: 1fr; gap: 8px; padding: 0 16px; overflow: auto; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 7px 14px; border-radius: 6px; z-index: 80; font-size: 12.5px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <i style="background:#6aa84f"></i><i style="background:#6aa84f"></i><i style="background:#8a8f99"></i>
        <i style="background:#8b5e3c"></i><i style="background:#8a8f99"></i><i style="background:#8a8f99"></i>
        <i style="background:#8a8f99"></i><i style="background:#4b4f5a"></i><i style="background:#4b4f5a"></i>
      </div>
      <h1>Density Function Workbench</h1>
      <span class="ver" title="Density function format">MC 26.3 format</span>
    </div>
    <button class="btn" id="btn-presets" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h12M2 12h8"/></svg>Presets</button>
    <button class="btn" id="btn-add" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3v10M3 8h10"/></svg>Add node</button>
    <div class="group">
      <button class="btn icon" id="btn-undo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3 2 6l3 3"/><path d="M2 6h7a4 4 0 0 1 0 8H6"/></svg></button>
      <button class="btn icon" id="btn-redo" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m11 3 3 3-3 3"/><path d="M14 6H7a4 4 0 0 0 0 8h3"/></svg></button>
    </div>
    <button class="btn" id="btn-layout" type="button" title="Tidy the graph"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2" width="5" height="4" rx="1"/><rect x="1.5" y="10" width="5" height="4" rx="1"/><rect x="10" y="6" width="4.5" height="4" rx="1"/><path d="M6.5 4h1.5v8H6.5M8 8h2"/></svg>Tidy</button>
    <button class="btn" id="btn-noises" type="button" title="Define custom noises">Noises</button>
    <span class="spacer"></span>
    <button class="btn" id="btn-import" type="button">Import JSON</button>
    <button class="btn primary" id="btn-copy" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>Copy JSON</button>
  </header>

  <div class="main">
    <section class="editor" id="editor" aria-label="Node editor">
      <div class="world" id="world">
        <svg class="wires" id="wires"></svg>
      </div>
      <div class="editor-hud">
        <button class="btn icon" id="btn-fit" type="button" title="Fit graph to view" aria-label="Fit graph"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg></button>
        <span class="hud-chip" id="zoom-chip">100%</span>
        <span class="hud-chip" id="count-chip">0 nodes</span>
      </div>
      <div class="editor-tip">
        <kbd>Right-click</kbd> or <kbd>Space</kbd> add node · drag a port onto empty space to add &amp; connect<br>
        <kbd>Del</kbd> delete · <kbd>Ctrl</kbd>+<kbd>D</kbd> duplicate · <kbd>Shift</kbd>+drag select · <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo
      </div>
    </section>
    <div class="split" id="split" role="separator" aria-orientation="vertical" aria-label="Resize preview"></div>
    <section class="preview" aria-label="Preview">
      <div class="pv-bar">
        <div class="group" id="mode-group">
          <button class="btn" data-mode="side" type="button">Side</button>
          <button class="btn" data-mode="top" type="button">Top</button>
          <button class="btn" data-mode="3d" type="button">3D chunk</button>
        </div>
        <span class="spacer"></span>
        <label class="ctl" for="seed">Seed <input id="seed" class="seed" type="text" value="0" spellcheck="false"></label>
        <button class="btn icon" id="btn-reseed" type="button" title="Random seed" aria-label="Random seed"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="2.5"/><circle cx="5.5" cy="5.5" r=".9" fill="currentColor"/><circle cx="10.5" cy="10.5" r=".9" fill="currentColor"/><circle cx="8" cy="8" r=".9" fill="currentColor"/></svg></button>
      </div>
      <div class="pv-controls" id="pv-controls">
        <label class="ctl" data-for="side" for="slice-z">Z <input id="slice-z" type="number" value="0" step="1"></label>
        <label class="ctl" data-for="top" for="slice-y">Y <input id="slice-y" type="number" value="64" step="1"></label>
        <label class="ctl" data-for="3d" for="chunk-x">Chunk <input id="chunk-x" type="number" value="0" step="1" style="width:56px" aria-label="Chunk X"> <input id="chunk-z" type="number" value="0" step="1" style="width:56px" aria-label="Chunk Z"></label>
        <label class="ctl" data-for="3d" for="chunk-size">Area <select id="chunk-size"><option value="1">1×1 chunk</option><option value="2">2×2 chunks</option><option value="3">3×3 chunks</option><option value="4">4×4 chunks</option></select></label>
        <label class="ctl" for="dim">World <select id="dim">
          <option value="overworld">Overworld −64…320</option>
          <option value="nether">Nether 0…128</option>
          <option value="end">End 0…256</option>
          <option value="custom">Custom</option>
        </select></label>
        <label class="ctl" for="min-y" data-custom>Min Y <input id="min-y" type="number" value="-64" step="16"></label>
        <label class="ctl" for="height" data-custom>Height <input id="height" type="number" value="384" step="16" min="16"></label>
        <label class="ctl" data-for="side top" for="colormap">Colors <select id="colormap">
          <option value="viridis">Viridis</option>
          <option value="gray">Grayscale</option>
          <option value="diverge">Diverging</option>
          <option value="solid">Solid / air</option>
        </select></label>
        <label class="ctl" data-for="side top" for="range-mode">Range <select id="range-mode">
          <option value="fixed">−1 … 1</option>
          <option value="auto">Auto</option>
        </select></label>
        <label class="ctl" data-for="3d" for="vox-colors">Blocks <select id="vox-colors">
          <option value="terrain">Terrain</option>
          <option value="plain">Plain stone</option>
          <option value="height">By height</option>
        </select></label>
        <button class="btn" data-for="3d" id="btn-reset-cam" type="button" style="height:26px">Reset view</button>
        <label class="ctl" for="sea">Sea level <input id="sea" type="number" value="63" step="1" style="width:56px"></label>
        <label class="ctl" for="show-water"><input id="show-water" type="checkbox" checked> Water</label>
      </div>
      <div class="stage" id="stage">
        <canvas id="cv2d"></canvas>
        <canvas id="cvov" class="overlay"></canvas>
        <div id="gl-host" style="position:absolute;inset:0"></div>
        <div class="readout" id="readout" hidden></div>
        <div class="legend" id="legend"><span id="lg-min">-1</span><canvas id="lg-bar" width="90" height="8"></canvas><span id="lg-max">1</span></div>
        <div class="progress" id="progress"></div>
      </div>
      <div class="pv-status" id="pv-status"></div>
      <details class="json-pane" id="json-pane">
        <summary><span class="chev">▸</span> Output JSON <span class="spacer"></span><span class="hint" id="json-size"></span></summary>
        <pre id="json-out"></pre>
      </details>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
